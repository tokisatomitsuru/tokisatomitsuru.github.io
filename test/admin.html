<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目的地設定 - GPS体験</title>
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <!-- 共通CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="admin-layout">

    <!-- ナビゲーション -->
    <nav class="admin-nav">
      <span class="admin-nav-title">
        <i class="fa-solid fa-map-pin"></i> 目的地設定
      </span>
      <a href="index.html" class="btn btn-sm">
        <i class="fa-solid fa-arrow-left"></i> 体験に戻る
      </a>
    </nav>

    <!-- メインコンテンツ -->
    <main class="admin-container">
      
      <!-- 左側: 目的地一覧 -->
      <section class="admin-sidebar">
        <div class="panel-header">
          <h2>登録済みの目的地</h2>
          <span id="locationCount" style="font-size: 0.75rem; color: var(--text-muted);">0箇所</span>
        </div>
        <div class="panel-body" id="locationListContainer">
          <div class="location-list" id="locationList">
            <!-- JavaScriptで挿入 -->
          </div>
        </div>
        
        <!-- インポート/エクスポート -->
        <div class="backup-panel">
          <button id="exportBtn" class="btn btn-sm">
            <i class="fa-solid fa-download"></i> エクスポート
          </button>
          <button id="importBtn" class="btn btn-sm">
            <i class="fa-solid fa-upload"></i> インポート
          </button>
          <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>
      </section>

      <!-- 右側: 登録フォームと地図 -->
      <section class="admin-form-area">
        <h2><i class="fa-solid fa-sliders" style="margin-right: 8px;"></i>感度・表示設定</h2>

        <div class="form-section">
          <div class="form-section-title">距離感度</div>
          <div class="form-group">
            <label for="settingTriggerDistance">到達判定距離のデフォルト: <strong id="settingTriggerDistanceLabel">15</strong> m</label>
            <input type="range" id="settingTriggerDistance" class="range-slider" min="5" max="200" value="15">
          </div>
          <div class="form-group">
            <label for="settingFadeDistance">フェードイン開始距離（感度）: <strong id="settingFadeDistanceLabel">100</strong> m</label>
            <input type="range" id="settingFadeDistance" class="range-slider" min="20" max="500" value="100">
          </div>
          <p style="font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; line-height: 1.5;">各目的地に個別の到達判定距離がある場合はそちらが優先されます。フェードイン開始距離は背景色や音量の変化が始まる距離です。</p>
        </div>

        <div class="form-section">
          <div class="form-section-title">背景色（接近時）</div>
          <div class="form-group">
            <label for="settingBgColor">近づくにつれて変化する色</label>
            <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px;">
              <input type="color" id="settingBgColor" value="#1a0a2e" style="width: 36px; height: 28px; border: 1px solid var(--border); background: transparent; cursor: pointer; padding: 2px;">
              <span id="settingBgColorHex" style="font-size: 0.78rem; color: var(--text-muted); font-family: monospace;">#1a0a2e</span>
            </div>
          </div>
          <div class="form-group" style="margin-top: 8px;">
            <label style="margin-bottom: 6px; display: block;">プリセット</label>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              <button type="button" class="bg-preset-btn" data-color="#1a0a2e" style="background:#1a0a2e; width:24px; height:24px; border:1px solid var(--border); cursor:pointer;"></button>
              <button type="button" class="bg-preset-btn" data-color="#0a1a2e" style="background:#0a1a2e; width:24px; height:24px; border:1px solid var(--border); cursor:pointer;"></button>
              <button type="button" class="bg-preset-btn" data-color="#0a2e14" style="background:#0a2e14; width:24px; height:24px; border:1px solid var(--border); cursor:pointer;"></button>
              <button type="button" class="bg-preset-btn" data-color="#2e0a0a" style="background:#2e0a0a; width:24px; height:24px; border:1px solid var(--border); cursor:pointer;"></button>
              <button type="button" class="bg-preset-btn" data-color="#1a1a0a" style="background:#1a1a0a; width:24px; height:24px; border:1px solid var(--border); cursor:pointer;"></button>
              <button type="button" class="bg-preset-btn" data-color="#0a2e2e" style="background:#0a2e2e; width:24px; height:24px; border:1px solid var(--border); cursor:pointer;"></button>
            </div>
          </div>
        </div>

        <h2 style="margin-top: 32px;"><i class="fa-solid fa-plus" style="margin-right: 8px;"></i>目的地の登録・編集</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
          <!-- 登録フォーム -->
          <form id="locationForm" style="display: flex; flex-direction: column; gap: 14px;">
            <input type="hidden" id="editId">
            
            <div class="form-section">
              <div class="form-section-title">基本情報</div>
              <div class="form-group">
                <label class="form-label" for="locName">目的地名</label>
                <input type="text" id="locName" class="form-input" placeholder="例: 渋谷ハチ公像" required>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="locLat">緯度</label>
                  <input type="number" id="locLat" class="form-input" placeholder="35.659056" step="0.000001" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="locLng">経度</label>
                  <input type="number" id="locLng" class="form-input" placeholder="139.700581" step="0.000001" required>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="locDesc">説明文</label>
                <textarea id="locDesc" class="form-input" placeholder="接近時に表示する説明文" rows="3" style="resize: none;"></textarea>
              </div>
            </div>

            <div class="form-section">
              <div class="form-section-title">メディア</div>
              <div class="form-group">
                <label class="form-label" for="mediaType">タイプ</label>
                <select id="mediaType" class="form-input form-select">
                  <option value="audio">音声 (Audio)</option>
                  <option value="video">動画 (Video)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="mediaUrl">メディアURL / パス</label>
                <input type="text" id="mediaUrl" class="form-input" placeholder="assets/audio.mp3 または https://..." required>
              </div>
              <div class="form-group">
                <label class="form-label" for="imageUrl">画像URL / パス (任意)</label>
                <input type="text" id="imageUrl" class="form-input" placeholder="assets/image.jpg または https://...">
              </div>
            </div>

            <div class="form-section">
              <div class="form-section-title">到達判定距離</div>
              <div class="form-group">
                <label class="form-label" for="triggerDistance">到達判定距離 (m) — 空欄の場合はデフォルト値を使用</label>
                <input type="number" id="triggerDistance" class="form-input" placeholder="例: 20" min="1" max="500">
              </div>
            </div>

            <div class="form-row">
              <button type="button" id="resetFormBtn" class="btn btn-sm">キャンセル</button>
              <button type="submit" id="saveBtn" class="btn btn-primary btn-sm">登録・更新</button>
            </div>
          </form>

          <!-- 地図領域 -->
          <div style="display: flex; flex-direction: column; min-height: 400px; border: 1px solid var(--border);">
            <div style="padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.72rem; color: var(--text-muted);">
              地図クリックで緯度経度を自動入力
            </div>
            <div id="map" style="flex: 1;"></div>
          </div>
        </div>

        <!-- サンプルデータリセット -->
        <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; align-items: center; gap: 12px;">
          <span style="font-size: 0.78rem; color: var(--text-muted);">初期サンプルデータにリセット</span>
          <button id="resetDefaultsBtn" class="btn btn-sm btn-danger">
            <i class="fa-solid fa-rotate-left"></i> リセット
          </button>
        </div>
      </section>

    </main>
  </div>

  <!-- 通知トースト -->
  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-info"></i> <span id="toastMsg"></span>
  </div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- JavaScript ロジック -->
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
