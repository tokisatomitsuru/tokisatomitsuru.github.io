<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS連動 体験</title>
  
  <!-- Leaflet Map CSS (裏でGPS測位計算を行うため必要) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <!-- 共通・体験画面用 CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 画面上部の最小限のコントロール -->
  <div class="minimal-nav">
    <span id="trackingStatus" class="minimal-status">
      <i class="fa-solid fa-circle-notch fa-spin"></i> GPS測位中...
    </span>
  </div>

  <!-- メインコンテンツ (基本は真っ暗で、近づくとフェードインしてくる) -->
  <main class="minimal-experience-container">
    
    <!-- 接近時に中央に浮かび上がるコンテンツ -->
    <div class="proximity-fade-content" id="proximityFadeContent">
      <div class="target-preview-container" id="targetImageContainer" style="display: none;">
        <img id="targetImage" src="" alt="目的地画像" class="target-preview-img">
      </div>
      <h1 class="target-name" id="targetName">目的地を探しています</h1>
      <p class="target-desc" id="targetDesc">近くに目的地はありません。</p>
      
      <!-- 近づいたときだけ小さく出る距離情報 -->
      <div class="minimal-distance" id="distanceValContainer">
        距離: <span id="distanceVal">--</span>
      </div>
    </div>

  </main>

  <!-- 非表示のマップコンテナ (裏でGPS測位計算を行うため必要) -->
  <div id="map" style="display: none;"></div>
  
  <!-- GPS精度（最小表示） -->
  <div id="gpsAccuracy" class="minimal-accuracy">精度: 測定中</div>

  <!-- デバッグ用シミュレータパネル (PC検証用) -->
  <button id="simToggleBtn" class="sim-toggle-minimal" title="設定 / シミュレータ">
    <i class="fa-solid fa-sliders"></i>
  </button>
  
  <div id="simPanel" class="sim-panel">
    <div class="sim-panel-header">
      <span><i class="fa-solid fa-sliders"></i> 設定 / シミュレータ</span>
      <button id="simCloseBtn" class="sim-close-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- シミュレータ -->
    <div class="sim-section">
      <div class="sim-section-title">GPSシミュレータ</div>
      <div class="form-group">
        <label for="simMode">モード</label>
        <select id="simMode" class="form-input form-select">
          <option value="real">リアルGPS (本番)</option>
          <option value="sim">仮想GPS (デバッグ)</option>
        </select>
      </div>
      
      <div id="simControls" style="display: none;">
        <div class="form-group">
          <label>最も近いターゲットに近づく</label>
          <input type="range" id="distanceSlider" class="range-slider" min="0" max="100" value="100">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>緯度 (Lat)</label>
            <input type="number" id="simLat" class="form-input" step="0.000001" readonly>
          </div>
          <div class="form-group">
            <label>経度 (Lng)</label>
            <input type="number" id="simLng" class="form-input" step="0.000001" readonly>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- メディアポップアップモーダル -->
  <div id="mediaModal" class="modal-overlay">
    <div class="media-modal flat-modal">
      <div class="media-header">
        <div class="media-title-group">
          <h3 id="modalTargetName">目的地に到達しました</h3>
          <p id="modalTargetDesc"></p>
        </div>
        <button id="closeModalBtn" class="close-btn">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="media-body">
        <div class="media-content-container">
          <video id="playerVideo" controls playsinline style="display: none;"></video>
          
          <div id="audioVisuals" class="audio-visualizer" style="display: none;">
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
          </div>
        </div>
        
        <div class="media-controls">
          <audio id="playerAudio" controls style="display: none;"></audio>
        </div>
      </div>
    </div>
  </div>

  <!-- バックグラウンド音声用のミニコントローラー (音声再生中のみ薄く出現) -->
  <div id="bgAudioController" class="bg-audio-controller" style="display: none;">
    <div class="bg-audio-info">
      <i class="fa-solid fa-music fa-beat" style="color: hsl(var(--distance-hue), 90%, 65%); font-size: 0.85rem;"></i>
      <span id="bgAudioName">音声ファイルを再生中</span>
    </div>
    <button id="bgAudioPlayBtn" class="icon-btn" style="border-radius: 50%; width: 28px; height: 28px;" title="一時停止/再生">
      <i class="fa-solid fa-pause" style="font-size: 0.75rem;"></i>
    </button>
  </div>

  <!-- 通知トースト -->
  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-info"></i> <span id="toastMsg"></span>
  </div>

  <!-- Leaflet Map JS (裏動作に必要) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- JavaScript ロジック -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
